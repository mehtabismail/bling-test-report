<html dir="ltr" lang="en">

    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="stylesheet" type="text/css" href="plugin/screen-diff/styles.css">
</head>
<body>

    <div id="content">
        <span class="spinner">
            <span class="spinner__circle"></span>
        </span>
    </div>

    <script src="plugin/behaviors/index.js"></script>
    <script src="plugin/packages/index.js"></script>
    <script src="plugin/screen-diff/index.js"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FVWC4GKEYS"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-FVWC4GKEYS', {
          'allureVersion': '2.34.1',

<!-- bling-run-nav: added by scripts/inject-report-nav.js -->
<style>
  .bling-run-nav {
    position: fixed; right: 16px; bottom: 16px; z-index: 2147483000;
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .bling-run-nav a { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .bling-run-nav-btn {
    background: #1f2937; color: #fff; border-radius: 999px; padding: 9px 15px;
    box-shadow: 0 2px 10px rgba(0,0,0,.28); font-weight: 600;
  }
  .bling-run-nav-btn:hover { background: #111827; }
  .bling-run-nav-archived {
    background: #fef3c7; color: #7c4a03; border: 1px solid #f2c25c;
    border-radius: 999px; padding: 7px 13px; font-weight: 600;
    box-shadow: 0 2px 10px rgba(0,0,0,.16);
  }
  .bling-run-nav-archived:hover { background: #fde9ad; }
  @media print { .bling-run-nav { display: none; } }
</style>
<div class="bling-run-nav" id="bling-run-nav"></div>
<script>
(function () {
  var BASE = "https://mehtabismail.github.io/bling-test-report/";
  var host = document.getElementById("bling-run-nav");
  if (!host) return;

  // An archived copy lives at <base>runs/<n>/. Detected from the path so that a single
  // injected block behaves correctly in both the root report and every archived copy.
  var archived = (location.pathname || "").match(/\/runs\/(\d+)\//);

  if (archived) {
    var back = document.createElement("a");
    back.className = "bling-run-nav-archived";
    back.href = BASE;
    back.textContent = "Archived run #" + archived[1] + " · open latest";
    back.title = "You are viewing an archived run, not the newest one";
    host.appendChild(back);
  }

  var history = document.createElement("a");
  history.className = "bling-run-nav-btn";
  history.href = BASE + "runs/";
  history.textContent = "Run history";
  history.title = "Browse past runs, filtered by date";
  host.appendChild(history);
})();
</script>
</body>
</html>
